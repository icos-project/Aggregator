apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aggregator.fullname" . }}-test-connection"
  labels:
    {{- include "aggregator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    {{- if .Values.service.httpPort }}
    - name: http-health-check
      image: busybox
      command: ['wget']
      args: ['{{ include "aggregator.fullname" . }}:{{ .Values.service.httpPort }}/healthz']
    {{- end }}
    {{- if .Values.service.grpcPort }}
    - name: grpc-health-check
      image: busybox
      command: ['sh', '-c']
      args: ['nc -vz {{ include "aggregator.fullname" . }} {{ .Values.service.grpcPort }}']
    {{- end }}
  restartPolicy: Never
